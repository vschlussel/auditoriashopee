<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZPL Converter - Independente</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      background: #FBF8F3; 
      color: #14110F;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #DCD3C2;
      margin-bottom: 30px;
    }
    .brand { font-size: 24px; font-weight: 700; }
    .brand span { color: #C2552F; }
    nav a { margin-left: 30px; text-decoration: none; color: #14110F; }
    .content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .section { background: white; padding: 24px; border: 1px solid #DCD3C2; border-radius: 4px; }
    textarea {
      width: 100%;
      height: 300px;
      padding: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      border: 1px solid #DCD3C2;
      border-radius: 4px;
      resize: vertical;
    }
    button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: #C2552F;
      color: white;
      border: none;
      border-radius: 3px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #963F22; }
    button:disabled { background: #B0A399; cursor: not-allowed; }
    .preview {
      background: white;
      border: 1px solid #DCD3C2;
      border-radius: 4px;
      padding: 20px;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas { max-width: 100%; }
    .error {
      padding: 12px;
      background: #FEE8E0;
      color: #A3331F;
      border-radius: 3px;
      margin-top: 10px;
      display: none;
    }
    .error.show { display: block; }
    .controls { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      color: #8C8570;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #DCD3C2;
      border-radius: 3px;
      font-size: 13px;
    }
    .example-btn {
      background: #3F5B43;
      font-size: 12px;
      padding: 8px 12px;
      width: auto;
      margin-top: 8px;
    }
    .example-btn:hover { background: #2F4B33; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <div class="brand">Auditoria<span>.</span>Shopee</div>
      <small style="color: #8C8570;">ZPL CONVERTER</small>
    </div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="javascript:void(0)" style="color: #C2552F; font-weight: 700;">Conversor ZPL</a>
      <a href="/perfil.html">Perfil</a>
    </nav>
  </header>

  <div class="content">
    <div class="section">
      <h2 style="margin-bottom: 16px; font-size: 18px;">Código ZPL</h2>
      
      <div class="controls">
        <label>Resolução (DPI)</label>
        <select id="dpiSelect">
          <option value="203">203 DPI (Padrão)</option>
          <option value="300">300 DPI</option>
        </select>
      </div>

      <textarea id="zplInput" placeholder="Cole seu código ZPL aqui...
Exemplo:
^XA
^MMT
^PW812
^LL406
^FT50,50^A0N,50,50^FDHello World^FS
^XZ"></textarea>

      <button class="example-btn" onclick="loadExample()">📋 Carregar Exemplo</button>
      <button onclick="convert()">🔄 Converter</button>

      <div id="error" class="error"></div>
    </div>

    <div class="section">
      <h2 style="margin-bottom: 16px; font-size: 18px;">Preview</h2>
      <div class="preview">
        <canvas id="canvas" width="812" height="1218" style="border: 1px solid #DCD3C2;"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const ctx = document.getElementById('canvas').getContext('2d');

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('error').classList.remove('show');
}

function loadExample() {
  const example = `^XA
^MMT
^PW812
^LL406
^LS0
^FT50,50^A0N,50,50^FDProduto Exemplo^FS
^FT50,150^BCN,100,Y,N,N
^FD1234567890^FS
^FT50,250^A0N,30,30^FDPRECO: R$ 99,90^FS
^XZ`;
  document.getElementById('zplInput').value = example;
  hideError();
}

function convert() {
  hideError();
  const zplCode = document.getElementById('zplInput').value.trim();
  const dpi = document.getElementById('dpiSelect').value;

  if (!zplCode) {
    showError('Por favor, insira um código ZPL válido');
    return;
  }

  try {
    // Limpar canvas
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, 812, 1218);
    ctx.fillStyle = 'black';
    ctx.font = '20px Arial';

    // Parse básico do ZPL
    const lines = zplCode.split(/\^[A-Z]/);
    let y = 50;

    // Mostrar representação visual simplificada
    ctx.fillText('🏷️ ZPL Converter - Preview Básico', 50, y);
    y += 40;
    ctx.font = '14px monospace';
    ctx.fillStyle = '#666';

    // Mostrar linhas do código
    zplCode.split('\n').slice(0, 5).forEach(line => {
      if (line.trim() && line.startsWith('^')) {
        ctx.fillText(line.trim(), 50, y);
        y += 25;
      }
    });

    ctx.font = '12px Arial';
    ctx.fillStyle = '#999';
    ctx.fillText('Preview simplificado - Para resultado final, use Labelary.com', 50, y + 40);

  } catch (err) {
    showError('Erro ao processar ZPL: ' + err.message);
    console.error(err);
  }
}

// Carregar exemplo automaticamente
window.addEventListener('load', loadExample);
</script>
</body>
</html>
