<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZPL Converter · Auditoria.Shopee</title>
  <style>
    :root {
      --ink: #14110F;
      --paper: #FBF8F3;
      --rust: #C2552F;
      --moss: #3F5B43;
      --line: #DCD3C2;
    }
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; }
    
    header { border-bottom: 1px solid var(--line); padding: 20px 0; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
    .brand { font-size: 22px; font-weight: 700; }
    .brand span { color: var(--rust); }
    nav { display: flex; gap: 30px; margin-top: 20px; }
    nav a { text-decoration: none; color: var(--ink); font-size: 14px; }
    nav a.active { color: var(--rust); font-weight: 600; }

    .converter { padding: 50px 0; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    .panel { display: flex; flex-direction: column; gap: 20px; }
    .panel h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    label { font-size: 12px; color: #8C8570; text-transform: uppercase; display: block; margin-bottom: 8px; }
    
    textarea {
      width: 100%;
      height: 300px;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 3px;
      resize: vertical;
    }
    
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 3px;
      font-size: 14px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 3px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      width: 100%;
      background: var(--rust);
      color: white;
      margin-top: 20px;
    }
    .btn-primary:hover { background: #963F22; }
    .btn-primary:disabled { background: #B0A399; cursor: not-allowed; }

    .btn-secondary {
      background: var(--moss);
      color: white;
      width: 100%;
    }
    .btn-secondary:hover { background: #2F5137; }

    .preview-panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 24px;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    #previewImage {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
    }

    .preview-empty {
      text-align: center;
      color: #8C8570;
    }

    .error {
      padding: 14px;
      background: #FEE8E0;
      border: 1px solid #E8C4B8;
      border-radius: 3px;
      color: #A3331F;
      display: none;
      margin-top: 16px;
      font-size: 13px;
    }
    .error.show { display: block; }

    .download-btn {
      display: none;
      width: 100%;
      padding: 16px;
      background: var(--moss);
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 12px;
    }
    .download-btn.show { display: block; }
    .download-btn:hover { background: #2F5137; }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">Auditoria<span>.</span>Shopee <small style="font-size: 12px; color: #8C8570;">ZPL CONVERTER</small></div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/zpl-converter.html" class="active">Conversor ZPL</a>
      <a href="/perfil.html">Perfil</a>
    </nav>
  </div>
</header>

<section class="converter">
  <div class="wrap">
    <div class="container">
      
      <div class="panel">
        <h3>Código ZPL</h3>
        
        <div>
          <label>Formato de Saída</label>
          <select id="formatSelect">
            <option value="png">PNG</option>
            <option value="pdf">PDF</option>
            <option value="jpg">JPG</option>
          </select>
        </div>

        <div>
          <label>Resolução (DPI)</label>
          <select id="dpiSelect">
            <option value="203">203 DPI (Padrão)</option>
            <option value="300">300 DPI</option>
          </select>
        </div>

        <textarea id="zplInput" placeholder="^XA
^PW812
^LL406
^FT50,50^A0N,50,50^FDSeu Texto^FS
^XZ"></textarea>

        <button class="btn-secondary" onclick="loadExample()">📋 Carregar Exemplo</button>
        <button class="btn-primary" id="convertBtn" onclick="handleConvert()">🔄 Converter</button>

        <div id="error" class="error"></div>
      </div>

      <div class="panel">
        <h3>Preview</h3>
        
        <div class="preview-panel">
          <div class="preview-empty" id="previewEmpty">
            <p>Sua etiqueta aparecerá aqui</p>
            <p style="font-size: 12px; margin-top: 8px;">Cole código ZPL e clique em "Converter"</p>
          </div>
          <img id="previewImage" style="display: none;" alt="Preview ZPL" />
        </div>

        <button class="download-btn" id="downloadBtn" onclick="downloadFile()">⬇️ Download Etiqueta</button>
      </div>

    </div>
  </div>
</section>

<script>
let currentPreviewBlob = null;

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('error').classList.remove('show');
}

function loadExample() {
  const example = `^XA
^MMT
^PW812
^LL406
^LS0
^FT50,50^A0N,50,50^FDProduto Exemplo^FS
^FT50,150^BCN,100,Y,N,N
^FD1234567890^FS
^FT50,250^A0N,30,30^FDPRECO: R$ 99,90^FS
^XZ`;
  document.getElementById('zplInput').value = example;
  hideError();
}

async function handleConvert() {
  hideError();
  const zplCode = document.getElementById('zplInput').value.trim();
  const dpi = document.getElementById('dpiSelect').value;
  const format = document.getElementById('formatSelect').value;

  if (!zplCode) {
    showError('Por favor, insira um código ZPL válido');
    return;
  }

  const btn = document.getElementById('convertBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Convertendo...';

  try {
    console.log('Enviando para API:', { zpl: zplCode.substring(0, 50) + '...', format, dpi });

    const response = await fetch('/api/convert-zpl', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        zpl: zplCode,
        format: format,
        dpi: dpi
      })
    });

    console.log('Response status:', response.status);

    if (!response.ok) {
      const text = await response.text();
      console.error('Error response:', text);
      throw new Error(`Erro ${response.status}: ${text.substring(0, 100)}`);
    }

    const blob = await response.blob();
    console.log('Blob recebido:', blob.type, blob.size);

    currentPreviewBlob = blob;
    const imageUrl = URL.createObjectURL(blob);

    document.getElementById('previewEmpty').style.display = 'none';
    document.getElementById('downloadBtn').classList.add('show');

    const img = document.getElementById('previewImage');
    img.src = imageUrl;
    img.style.display = 'block';

    console.log('Preview exibido com sucesso!');

  } catch (err) {
    console.error('Erro completo:', err);
    showError('Erro: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 Converter';
  }
}

function downloadFile() {
  if (!currentPreviewBlob) {
    showError('Nenhuma etiqueta para baixar');
    return;
  }

  const url = URL.createObjectURL(currentPreviewBlob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `etiqueta-${Date.now()}.png`;
  link.click();
  URL.revokeObjectURL(url);
}

// Carregar exemplo ao abrir
window.addEventListener('load', loadExample);
</script>

</body>
</html>
