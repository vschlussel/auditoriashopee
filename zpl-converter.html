<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ZPL Converter</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    textarea { width: 100%; height: 300px; padding: 10px; font-family: monospace; }
    button { padding: 10px 20px; margin: 10px 0; cursor: pointer; width: 100%; }
    #preview { width: 100%; border: 1px solid #ccc; background: white; min-height: 300px; display: flex; align-items: center; justify-content: center; }
    #preview img { max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>

<h1>ZPL Converter</h1>

<div class="container">
  <div>
    <h2>Código ZPL</h2>
    <textarea id="zpl">^XA
^MMT
^PW812
^LL406
^LS0
^FT50,50^A0N,50,50^FDProduto Exemplo^FS
^FT50,150^BCN,100,Y,N,N
^FD1234567890^FS
^FT50,250^A0N,30,30^FDPRECO: R$ 99,90^FS
^XZ</textarea>
    <button onclick="converter()">CONVERTER</button>
    <button onclick="download()">DOWNLOAD</button>
  </div>

  <div>
    <h2>Preview</h2>
    <div id="preview">
      <p>Cole ZPL e clique CONVERTER</p>
    </div>
  </div>
</div>

<script>
let blob = null;

async function converter() {
  const zpl = document.getElementById('zpl').value;
  
  console.log('Enviando ZPL:', zpl.substring(0, 50));
  
  try {
    const r = await fetch('/api/convert-zpl', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zpl, dpi: '203' })
    });
    
    console.log('Status:', r.status);
    
    if (!r.ok) throw new Error(`Erro ${r.status}`);
    
    blob = await r.blob();
    console.log('Blob recebido:', blob.type, blob.size, 'bytes');
    
    const url = URL.createObjectURL(blob);
    console.log('URL criada:', url);
    
    const img = document.createElement('img');
    img.src = url;
    img.onload = () => console.log('Imagem carregada!');
    img.onerror = (e) => console.error('Erro ao carregar:', e);
    
    document.getElementById('preview').innerHTML = '';
    document.getElementById('preview').appendChild(img);
    
    console.log('Imagem adicionada ao DOM');
    
  } catch (e) {
    console.error('Erro:', e);
    alert('Erro: ' + e.message);
  }
}

function download() {
  if (!blob) {
    alert('Converter primeiro!');
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'etiqueta.png';
  a.click();
}
</script>

</body>
</html>
